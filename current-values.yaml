configOverrides:
  activity_log: "import json\nimport logging\nimport requests\nfrom datetime import
    datetime\nfrom flask import g, request\nfrom google.cloud import bigquery\nfrom
    superset.utils.log import AbstractEventLogger\nfrom superset.extensions import
    stats_logger_manager\nfrom superset.utils.core import get_user_id, get_username\n\nlogger
    = logging.getLogger(__name__)\n\ndef get_project_id():\n    try:\n        METADATA_URL
    = \"http://metadata.google.internal/computeMetadata/v1/project/project-id\"\n
    \       headers = {\"Metadata-Flavor\": \"Google\"}\n        resp = requests.get(METADATA_URL,
    headers=headers, timeout=2)\n        resp.raise_for_status()\n        return resp.text\n
    \   except Exception as e:\n        logger.warning(\"Could not get project ID
    from metadata server: %s\", e)\n        return \"unknown_project\"\n\ndef get_dashboard_chart_names(dashboard_id,
    slice_id):\n    \"\"\"Fetch dashboard and chart names from the database\"\"\"\n
    \   dashboard_name = None\n    chart_name = None\n\n    try:\n        from superset.models.dashboard
    import Dashboard\n        from superset.models.slice import Slice\n        from
    superset import db\n\n        # Look up dashboard name if we have a valid dashboard_id\n
    \       if dashboard_id and str(dashboard_id) != \"0\":\n            dashboard
    = db.session.query(Dashboard).filter_by(id=int(dashboard_id)).first()\n            if
    dashboard:\n                dashboard_name = dashboard.dashboard_title\n\n        #
    Look up chart/slice name if we have a valid slice_id\n        if slice_id and
    str(slice_id) != \"0\":\n            slice_obj = db.session.query(Slice).filter_by(id=int(slice_id)).first()\n
    \           if slice_obj:\n                chart_name = slice_obj.slice_name\n
    \   except Exception as e:\n        logger.warning(f\"Failed to fetch dashboard/chart
    names: {e}\")\n\n    return dashboard_name, chart_name\n\nclass BigQueryEventLogger(AbstractEventLogger):\n
    \   def __init__(self):\n        super().__init__()\n        self.client = None\n
    \       self.table = None\n        self._initialized = False\n        logger.warning(\"\U0001F680
    BigQueryEventLogger initialized\")\n\n    def _ensure_initialized(self):\n        if
    self._initialized and self.table:\n            return True\n\n        try:\n            if
    not self.client:\n                self.client = bigquery.Client()\n\n            project_id
    = get_project_id()\n            # Use the fully qualified table ID string instead
    of table reference\n            table_id = f\"{project_id}.aura_activity_log.log\"\n\n
    \           # Just store the table ID string, don't try to get the table object\n
    \           self.table_id = table_id\n            self._initialized = True\n            logger.warning(f\"✅
    BigQuery client initialized with table ID: {table_id}\")\n            return True\n
    \       except Exception as e:\n            logger.exception(\"Failed to initialize
    BigQuery client: %s\", e)\n            return False\n\n    def log(\n        self,\n
    \       user_id,\n        action,\n        records=None,\n        dashboard_id=None,\n
    \       slice_id=None,\n        duration_ms=None,\n        referrer=None,\n        curated_payload=None,\n
    \       curated_form_data=None,\n        **kwargs\n    ):\n        logger.warning(f\"\U0001F4CC
    BigQueryEventLogger.log called for action: {action}\")\n\n        if not self._ensure_initialized():\n
    \           logger.error(\"Failed to initialize BigQuery client\")\n            return\n\n
    \       if not records:\n            records = [{}]\n\n        # Get the username
    for the current user\n        username = get_username()\n\n        # Get dashboard
    and chart names\n        dashboard_name, chart_name = get_dashboard_chart_names(dashboard_id,
    slice_id)\n\n        rows_to_insert = []\n        for record in records:\n            try:\n
    \               # Generate a numeric ID from timestamp and random component\n
    \               import random\n                timestamp_ms = int(datetime.utcnow().timestamp()
    * 1000)\n                random_component = random.randint(0, 999999)\n                numeric_id
    = int(f\"{timestamp_ms}{random_component:06d}\")\n\n                log_row =
    {\n                    \"id\": numeric_id,\n                    \"dashboard_id\":
    dashboard_id,\n                    \"slice_id\": slice_id,\n                    \"duration_ms\":
    int(duration_ms) if duration_ms else None,\n                    \"user_id\": user_id,\n
    \                   \"username\": username,\n                    \"dashboard_name\":
    dashboard_name,  # Add dashboard name\n                    \"chart_name\": chart_name,
    \         # Add chart name\n                    \"dttm\": datetime.utcnow().isoformat(),\n
    \                   \"action\": action,\n                    \"referrer\": referrer,\n
    \                   \"json\": json.dumps({\n                        **record,\n
    \                       \"curated_payload\": curated_payload or {},\n                        \"curated_form_data\":
    curated_form_data or {},\n                        **kwargs\n                    })\n
    \               }\n                rows_to_insert.append(log_row)\n            except
    Exception as e:\n                logger.exception(f\"Failed to prepare log row:
    {e}\")\n\n        if rows_to_insert:\n            try:\n                # Use
    insert_rows_json with just the table ID string\n                errors = self.client.insert_rows_json(\n
    \                   self.table_id,  # Just pass the string table ID\n                    rows_to_insert,\n
    \                   ignore_unknown_values=True,  # Ignore extra fields\n                    skip_invalid_rows=False\n
    \               )\n                if errors:\n                    logger.error(f\"Failed
    to insert rows to BigQuery: {errors}\")\n                else:\n                    logger.warning(f\"✅
    Successfully logged {len(rows_to_insert)} rows to BigQuery\")\n            except
    Exception as e:\n                logger.exception(f\"Failed to send logs to BigQuery:
    {e}\")\n\n# Configure Superset to use our custom logger\nEVENT_LOGGER = BigQueryEventLogger()\nlogger.warning(\"\U0001F3AF
    EVENT_LOGGER set to BigQueryEventLogger instance\")\n"
