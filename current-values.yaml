    from superset.security import SupersetSecurityManager
    import logging
    logger = logging.getLogger(__name__)
    logger.setLevel(logging.DEBUG)

    class CustomSsoSecurityManager(SupersetSecurityManager):
      def oauth_user_info(self, provider, response=None):
          logging.debug("OAuth2 provider: {0}.".format(provider))
          if provider == 'auth0':
              # Retrieve the user information from the OAuth provider
              me_response = self.appbuilder.sm.oauth_remotes[provider].get(
                  os.getenv('OAUTH_BASE_URL') + '/userinfo'
              )

              if me_response.status_code == 200:
                  me_data = me_response.json()
                  logging.debug("User data: {0}".format(me_data))

                  # Extract UPN from custom claim (if present)
                  upn = me_data.get("barkleyokrp_upn", None)

                  # Fallback to name parsing
                  name_parts = me_data.get('name', '').split(' ', 1)
                  first_name = name_parts[0] if name_parts else ''
                  last_name = name_parts[1] if len(name_parts) > 1 else ''

                  return {
                      'name': me_data.get('name', me_data.get('email', '')),
                      'email': me_data.get('email', ''),
                      'id': upn or me_data.get('email', ''),
                      'username': upn or me_data.get('email', ''),
                      'first_name': me_data.get('first_name', me_data.get('given_name', first_name)),
                      'last_name': me_data.get('last_name', me_data.get('family_name', last_name))
                  }
              else:
                  logging.error("Failed to retrieve user information. Status code: {0}".format(me_response.status_code))
                  return None

    CUSTOM_SECURITY_MANAGER = CustomSsoSecurityManager

