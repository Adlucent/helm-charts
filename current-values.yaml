bootstrapScript: "# #!/bin/bash\n# pip install \\\n# dnspython==2.6.1 \\\n# authlib==1.2.0
  \\\n# psycopg2-binary==2.9.6 \n# shillelagh[gsheetsapi] \\\n# sqlalchemy-bigquery
  \\\n# snowflake-sqlalchemy \\\n# pandas-gbq \\\n# redis==4.6.0 && \\\n\nif [ ! -f
